[build]
  # node_modules is committed from a Windows machine (no exec bits, Windows-only
  # native binaries), so reinstall cleanly from the lockfile before building.
  command = "npm ci && npm run build"
  publish = "dist"

# Serve index.html for client-side routes handled by React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
